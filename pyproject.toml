[project]
name = "voice-pipeline"
version = "0.1.0"
description = "准生产级实时语音对话链路参考实现：ASR+TTS 流水线的延迟账与可靠性工程"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sherpa-onnx>=1.13.8",
    "soxr>=1.1.0",
    "httpx>=0.27",  # real LLM provider 的流式调用（不是测试专用）
    # 云 TTS（DashScope CosyVoice 流式）：2C x86 上本地 TTS RTF≈14.5 判死后的出路
    "dashscope>=1.20",
    # 上界钉死：sherpa-onnx 的 Linux wheel 链接 onnxruntime VERS_1.28.2 符号版本，
    # 1.29+ 会在 import 时报 version `VERS_1.28.2' not found（macOS 不受影响，同钉为一致）
    "onnxruntime>=1.28.0,<1.29",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pytest-timeout>=2.4.0",
    # 评测数据准备专用（scripts/fetch_eou_dataset.py 解 parquet + flac），运行时不依赖
    "pyarrow>=17",
    "soundfile>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
# sherpa-onnx 未随 wheel 提供 py.typed / stubs —— 与其假装，不如显式忽略
[[tool.mypy.overrides]]
module = ["sherpa_onnx.*", "soxr.*", "onnxruntime.*", "dashscope.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# 并发链路里最容易出的故障是死锁，而死锁的默认表现是「挂住直到被超时杀掉」，
# 既掩盖真因又拖垮门禁。给每条用例兜一个 30s 上限，把挂起变成明确的失败。
timeout = 30
