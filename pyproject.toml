[project]
name = "voice-pipeline"
version = "0.1.0"
description = "准生产级实时语音对话链路参考实现：ASR+TTS 流水线的延迟账与可靠性工程"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sherpa-onnx>=1.13.8",
    "onnxruntime>=1.24.3",
    "soxr>=1.1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
# sherpa-onnx 未随 wheel 提供 py.typed / stubs —— 与其假装，不如显式忽略
[[tool.mypy.overrides]]
module = ["sherpa_onnx.*", "soxr.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# 并发链路里最容易出的故障是死锁，而死锁的默认表现是「挂住直到被超时杀掉」，
# 既掩盖真因又拖垮门禁。给每条用例兜一个 30s 上限，把挂起变成明确的失败。
timeout = 30
